name: Aggiorna calendario

on:
  schedule:
    - cron: '0 5 * * *'   # ogni giorno alle 05:00 UTC (06:00 in inverno, 07:00 in estate)
  workflow_dispatch:       # avvio manuale da Actions > Aggiorna calendario > Run workflow
  push:
    branches: [main]       # a ogni modifica dei file ripubblica il sito (senza riscaricare i dati)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Scarica gli eventi da faitango.it
        if: github.event_name != 'push'
        shell: powershell
        run: |
          $log = & .\scrape-faitango.ps1 -Days 60 -OutDir . *>&1 | Out-String
          Write-Output $log
          $m = [regex]::Match($log, 'Eventi: (\d+) \(dichiarati dal sito: (\d*)\)')
          if (-not $m.Success) { Write-Output "::error::Riga 'Eventi: N (dichiarati dal sito: M)' non trovata"; exit 1 }
          $n = [int]$m.Groups[1].Value
          $tot = $m.Groups[2].Value
          if ($n -le 100 -or "$n" -ne $tot) {
            Write-Output "::error::Controllo fallito: $n eventi scaricati, $tot dichiarati dal sito. Dati NON pubblicati."
            git checkout -- events.json
            exit 1
          }
          Write-Output "OK: $n eventi"

      - name: Salva i dati nel repository
        if: github.event_name != 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati"
          else
            git commit -m "Aggiorna eventi"
            git push
          fi

      - name: Prepara il sito
        shell: bash
        run: |
          mkdir _site
          cp index.html events.json _site/

      - uses: actions/upload-artifact@v4
        with:
          name: sito
          path: _site

  pubblica:
    needs: scarica
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sito
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
